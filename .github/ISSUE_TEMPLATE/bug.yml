name: 缺陷
description: 报告一个可以复现的缺陷
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请先搜索已有 Issue。不要粘贴 API Key、设置文件或未公开书稿。
  - type: textarea
    id: summary
    attributes:
      label: 发生了什么
      description: 实际结果和期望结果。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本或提交
      placeholder: 1.0.0 或 git 提交哈希
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 环境
      placeholder: Windows 11 / Node 22 / 厂商与模型名（不要写 Key）
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      description: 贴出报错即可。若日志里有密钥，先打码。
