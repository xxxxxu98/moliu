name: 功能
description: 提议一项改进
title: "[FEAT] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        先说明它推进北极星的哪一层。回答不了的提议，请改写成明确的质量问题。
  - type: dropdown
    id: layer
    attributes:
      label: 对应的质量层
      options:
        - L1 开篇
        - L2 节奏
        - L3 钩子与悬念
        - L4 爽点
        - L5 人物
        - L6 连续性
        - L7 文笔
        - L8 市场合规
        - 工程基础（测试、文档、打包），不直接改写作质量
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议做法
    validations:
      required: true
